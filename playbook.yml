---
- name: Install Git and Docker on Linux Instance
  hosts: aws_instances
  become: true

  tasks:
    - name: Update apt package index
      apt:
        update_cache: yes

    - name: Install Git
      apt:
        name: git
        state: present

    - name: Install Docker dependencies
      apt:
        name: 
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Update apt package index again
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker-ce
        state: present

    - name: Install Docker Compose
      get_url:
        url: "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Linux-x86_64"
        dest: "/usr/local/bin/docker-compose"
        mode: '0755'

    - name: Ensure Docker service is started
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Restart Docker service
      systemd:
        name: docker
        state: restarted
    # ------------------------
    # PostgreSQL
    
    - name: Add PostgreSQL GPG key
      apt_key:
        url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
        state: present

    - name: Add PostgreSQL repository
      apt_repository:
        repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
        state: present

    - name: Install PostgreSQL
      apt:
        name:
          - "postgresql-{{ postgres_version }}"
          - "postgresql-client-{{ postgres_version }}"
        state: present

    - name: Ensure PostgreSQL is running
      systemd:
        name: postgresql
        state: started
        enabled: yes

    # ------------------------
    # Java 21
    
    - name: Add OpenJDK 21 repository
      apt_repository:
        repo: ppa:openjdk-r/ppa
        state: present

    - name: Install Java 21
      apt:
        name: openjdk-21-jdk
        state: present

    # ------------------------
    # Node.js
  
    - name: Add NodeSource Node.js repository
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version }} | bash -
      args:
        executable: /bin/bash

    - name: Install Node.js
      apt:
        name: nodejs
        state: present

    # ------------------------
    # PM2
   
    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes

    - name: Enable PM2 startup
      command: pm2 startup systemd
      register: pm2_startup
      changed_when: "'PM2 startup' in pm2_startup.stdout"

    # ------------------------
    # Nginx
    
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx is running
      systemd:
        name: nginx
        state: started
        enabled: yes

    # ------------------------
    # Final confirmation
    
    - name: Installation completed
      debug:
        msg: "Git, Docker, PostgreSQL, Java 21, Node.js, PM2, and Nginx installed successfully."

